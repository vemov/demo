<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebRTC-Game</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
html,body{width:100vw;height:100vh;overflow:hidden;font-family:Tahoma,"MS Sans Serif",Arial,sans-serif;background:#c8dcec}
#viewport{width:100vw;height:100vh;overflow:hidden;position:relative;display:none}
#game-area{width:2000px;height:1000px;position:relative;background-color:#f3e5f5}
#game-canvas{display:block;background-color:#f3e5f5;background-image:url('./images/background.webp'),linear-gradient(#e1bee7 1px,transparent 1px),linear-gradient(90deg,#e1bee7 1px,transparent 1px);background-repeat:repeat,repeat,repeat;background-size:64px 64px,40px 40px,40px 40px;background-position:center;image-rendering:pixelated}
#terminal-container{position:fixed;bottom:0;left:0;width:100%;height:28px;background:#16324f;color:#b8d4ec;font-family:"Courier New",monospace;z-index:9999;display:none;flex-direction:column;border-top:1px solid #3a6a8c}
#terminal-container.expanded{height:176px}
#terminal-header{padding:4px 10px;background:linear-gradient(to bottom,#1e4060,#16324f);cursor:pointer;display:flex;justify-content:space-between;flex-shrink:0;font-size:11px;border-bottom:1px solid #0a1e30}
#terminal-body{flex:1;overflow-y:auto;padding:6px 10px;background:#0c1c2c;color:#6ecf6e;font-size:11px}
#terminal-body::-webkit-scrollbar{width:10px}
#terminal-body::-webkit-scrollbar-track{background:#0a1520;border-left:1px solid #1a3048}
#terminal-body::-webkit-scrollbar-thumb{background:linear-gradient(to bottom,#3a6a8c,#2a5070);border:1px solid #1a3048;border-radius:2px}
#top-bar{position:fixed;top:0;left:0;width:100%;height:28px;background:linear-gradient(to bottom,#4a9ad8,#2a6aab);display:none;align-items:center;padding:0 10px;z-index:10000;gap:8px;border-bottom:1px solid #1a4a7a;box-shadow:0 1px 3px rgba(0,0,0,.25)}
#btn-online,#btn-back-mode{background:linear-gradient(to bottom,#eef6fc,#c5daf0);color:#1a3a5c;border:1px solid #5a8ab8;padding:2px 12px;font-size:11px;cursor:pointer;font-family:Tahoma,sans-serif;height:22px;border-radius:3px;box-shadow:0 1px 0 rgba(255,255,255,.6) inset}
#btn-online:hover,#btn-back-mode:hover{background:linear-gradient(to bottom,#f5faff,#d4e8f8)}
#btn-back-mode{display:none}
#online-status{color:#e8f4ff;font-size:11px;margin-left:4px;text-shadow:0 1px 1px rgba(0,0,0,.3)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,35,55,.55);z-index:10001;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.icq-win{background:#e4eef8;border:1px solid #2a5a8a;box-shadow:0 4px 20px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.15) inset;width:330px;max-width:92vw;font-family:Tahoma,"MS Sans Serif",sans-serif;border-radius:4px;overflow:hidden}
.icq-title{background:linear-gradient(to bottom,#5aabd8,#2a7ab8);color:#fff;padding:5px 10px;font-size:12px;font-weight:bold;display:flex;justify-content:space-between;align-items:center;height:24px;text-shadow:0 1px 1px rgba(0,0,0,.35);border-bottom:1px solid #1a4a7a}
.icq-title .xbtn{background:linear-gradient(to bottom,#e87878,#c04040);border:1px solid #802020;color:#fff;width:17px;height:15px;font-size:11px;line-height:13px;padding:0;cursor:pointer;border-radius:2px;text-align:center;font-weight:bold}
.icq-content{padding:16px 18px 14px;background:#e4eef8;color:#1a3a5c;font-size:12px}
.icq-content label{display:block;font-size:11px;margin-bottom:3px;color:#2a4a6a;font-weight:bold}
.icq-content input[type=text]{width:100%;padding:5px 8px;border:1px solid #7a9ab8;background:#fff;font-size:12px;margin-bottom:11px;font-family:Tahoma,sans-serif;border-radius:3px}
.icq-content input[type=text]:focus{outline:none;border-color:#3a8ac8;box-shadow:0 0 0 2px rgba(58,138,200,.2)}
.icq-content .row{display:flex;gap:20px;margin:8px 0 14px}
.icq-content .row label{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;font-weight:normal;color:#1a3a5c}
.icq-btns{padding:10px 14px 14px;display:flex;gap:8px;justify-content:flex-end;background:#d4e4f0;border-top:1px solid #a8c0d8}
.icq-btn{background:linear-gradient(to bottom,#f0f6fc,#c0d8f0);border:1px solid #5a8ab0;padding:4px 18px;font-size:12px;cursor:pointer;font-family:Tahoma,sans-serif;border-radius:3px;color:#1a3a5c;min-width:72px}
.icq-btn:hover{background:linear-gradient(to bottom,#f8fcff,#d0e8f8)}
.icq-btn.primary{background:linear-gradient(to bottom,#6ab0e0,#3a80c0);border-color:#2a6090;color:#fff;font-weight:bold;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.icq-btn.primary:hover{background:linear-gradient(to bottom,#7ac0f0,#4a90d0)}
.spinner{width:38px;height:38px;border:3px solid #b8d4ec;border-top-color:#2a80c0;border-radius:50%;animation:spin .75s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.icq-status{font-size:11px;color:#4a6a8a;margin-top:4px;text-align:center;line-height:1.5}
.room-tag{display:inline-block;margin-top:8px;padding:3px 10px;background:#d0e4f5;border:1px solid #7a9ab8;border-radius:3px;font-size:12px;color:#1a3a5c;font-weight:bold}
#loading-screen{position:fixed;inset:0;z-index:20000;background:#1a3a5c;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e0f0ff;font-family:Tahoma,sans-serif}
#loading-screen.hidden{opacity:0;pointer-events:none;transition:opacity .4s}
#loading-title{font-size:16px;margin-bottom:18px;letter-spacing:1px}
#loading-bar-wrap{width:min(280px,80vw);height:14px;background:#0a1a2a;border:1px solid #4a7a9c;border-radius:3px;overflow:hidden}
#loading-bar{height:100%;width:0%;background:linear-gradient(to right,#2a80c0,#50b0e0);transition:width .15s}
#loading-text{margin-top:8px;font-size:11px;color:#8ab0d0}
#waiting-overlay{display:none;position:fixed;inset:0;background:#c8dcec;z-index:15000;align-items:center;justify-content:center}
#waiting-overlay.show{display:flex}
#error-modal .icq-content{text-align:center;padding:20px 16px}
#error-modal .err-icon{width:36px;height:36px;line-height:36px;margin:0 auto 10px;background:linear-gradient(to bottom,#e87878,#c04040);color:#fff;border-radius:50%;font-size:20px;font-weight:bold}
</style>
</head>
<body>
<div id="loading-screen"><div id="loading-title">资源加载中</div><div id="loading-bar-wrap"><div id="loading-bar"></div></div><div id="loading-text">0%</div></div>
<div id="mode-modal" class="modal-overlay show"><div class="icq-win"><div class="icq-title"><span>WebRTC Game</span></div><div class="icq-content" style="text-align:center;padding:22px 16px 18px"><div style="font-size:13px;color:#1a3a5c;margin-bottom:18px;font-weight:bold">请选择游戏模式</div><div style="display:flex;gap:12px;justify-content:center"><button class="icq-btn primary" id="btn-mode-single">单人模式</button><button class="icq-btn primary" id="btn-mode-online">联机模式</button></div></div></div></div>
<div id="waiting-overlay"><div class="icq-win" style="width:300px"><div class="icq-title"><span>WebRTC Game - 连接中</span></div><div class="icq-content" style="text-align:center;padding:24px 16px 20px"><div class="spinner"></div><div style="font-size:13px;font-weight:bold;color:#1a3a5c;margin-bottom:6px" id="waiting-title">等待对方进入</div><div class="icq-status" id="waiting-status">正在连接信令服务器...</div><div id="waiting-room" class="room-tag" style="display:none"></div></div></div></div>
<div id="error-modal" class="modal-overlay"><div class="icq-win" style="width:300px"><div class="icq-title"><span>WebRTC Game - 提示</span><button class="xbtn" id="btn-error-close">×</button></div><div class="icq-content"><div class="err-icon">!</div><div id="error-msg" style="font-size:12px;color:#1a3a5c;line-height:1.55"></div></div><div class="icq-btns"><button class="icq-btn primary" id="btn-error-ok">确定</button></div></div></div>
<div id="top-bar"><button id="btn-online">联机</button><button id="btn-back-mode">返回模式选择</button><span id="online-status">未连接</span></div>
<div id="online-modal" class="modal-overlay"><div class="icq-win"><div class="icq-title"><span>WebRTC Game - 联机设置</span><button class="xbtn" id="btn-close-modal">×</button></div><div class="icq-content"><label>信令服务器地址</label><input type="text" id="input-wss" placeholder="wss://test.hefengcy.com"><label>房间号</label><input type="text" id="input-room" placeholder="输入房间号"><div class="row"><label><input type="radio" name="mode" value="create"> 创建房间</label><label><input type="radio" name="mode" value="join" checked> 加入房间</label></div></div><div class="icq-btns"><button class="icq-btn" id="btn-cancel">取消</button><button class="icq-btn primary" id="btn-confirm">确定</button></div></div></div>
<div id="viewport"><div id="game-area"><canvas id="game-canvas" width="2000" height="1000"></canvas><div id="tips-container"></div></div></div>
<div id="terminal-container"><div id="terminal-header" onclick="document.getElementById('terminal-container').classList.toggle('expanded')"><span>日志 | 坐标: <span id="coords-val">X: 0, Y: 0</span></span><span>[展开/收起]</span></div><div id="terminal-body"></div></div>
<script src="./virtual-controls.js" defer></script>
<script>
const viewport=document.getElementById('viewport'),canvas=document.getElementById('game-canvas'),ctx=canvas.getContext('2d'),coordsVal=document.getElementById('coords-val'),logBody=document.getElementById('terminal-body'),tipsContainer=document.getElementById('tips-container');
ctx.imageSmoothingEnabled=false;
const worldWidth=2000,worldHeight=1000,playerSize=120,SPAWN_HOST={x:800,y:450},SPAWN_JOIN={x:1250,y:450};
let posX=SPAWN_HOST.x,posY=SPAWN_HOST.y,speed=5,keys=new Set(),isWalking=false,walkIdx=0,walkTimer=null,isSitting=false,currentFrameMs=100,walkStartTime=0,lastVTime=0,sitTarget=null,sitSeatIdx=-1,sitItem=null;
const moveKeys=new Set(['w','a','s','d']);
let playerIdle='./images/player-z.webp',playerSit='./images/player-z/sit/sit.webp',playerSleep='./images/player-z/sleep/sleep.webp',walkFrames=['./images/player-z/walk/walk_0001.webp','./images/player-z/walk/walk_0002.webp'],remoteIdle='./images/player-x.webp',remoteSit='./images/player-x/sit/sit.webp',remoteSleep='./images/player-x/sleep/sleep.webp',remoteWalk=['./images/player-x/walk/walk_0001.webp','./images/player-x/walk/walk_0002.webp'];
const images={},ALL_IMAGE_SRCS=['./images/background.webp','./images/player-z.webp','./images/player-z/sit/sit.webp','./images/player-z/sleep/sleep.webp','./images/player-z/walk/walk_0001.webp','./images/player-z/walk/walk_0002.webp','./images/player-x.webp','./images/player-x/sit/sit.webp','./images/player-x/sleep/sleep.webp','./images/player-x/walk/walk_0001.webp','./images/player-x/walk/walk_0002.webp','./images/carpet.webp','./images/desk.webp','./images/plant.webp','./images/chair.webp','./images/sofa.webp','./images/bed.webp'];
function loadImage(src){if(images[src])return images[src];const img=new Image();img.src=src;images[src]=img;return img}
function setPlayerAssets(role){const z=role==='host';playerIdle=`./images/player-${z?'z':'x'}.webp`;playerSit=`./images/player-${z?'z':'x'}/sit/sit.webp`;playerSleep=`./images/player-${z?'z':'x'}/sleep/sleep.webp`;walkFrames=[`./images/player-${z?'z':'x'}/walk/walk_0001.webp`,`./images/player-${z?'z':'x'}/walk/walk_0002.webp`];remoteIdle=`./images/player-${z?'x':'z'}.webp`;remoteSit=`./images/player-${z?'x':'z'}/sit/sit.webp`;remoteSleep=`./images/player-${z?'x':'z'}/sleep/sleep.webp`;remoteWalk=[`./images/player-${z?'x':'z'}/walk/walk_0001.webp`,`./images/player-${z?'x':'z'}/walk/walk_0002.webp`];[playerIdle,playerSit,playerSleep,...walkFrames,remoteIdle,remoteSit,remoteSleep,...remoteWalk].forEach(loadImage)}
function preloadAllImages(){return new Promise(resolve=>{const total=ALL_IMAGE_SRCS.length;let loaded=0;const bar=document.getElementById('loading-bar'),text=document.getElementById('loading-text'),screen=document.getElementById('loading-screen');const tick=()=>{const pct=Math.round(loaded/total*100);bar.style.width=pct+'%';text.textContent=pct+'% ('+loaded+'/'+total+')';if(loaded>=total)setTimeout(()=>{screen.classList.add('hidden');setTimeout(()=>screen.remove(),450);resolve()},300)};ALL_IMAGE_SRCS.forEach(src=>{const img=new Image();img.onload=img.onerror=()=>{images[src]=img;loaded++;tick()};img.src=src})})}
const carpetData=[{id:'地毯',cx:1000,cy:650,w:400,h:200,src:'images/carpet.webp',level:-1}];
const furnitureData=[
{id:'方桌',cx:900,cy:400,w:200,h:120,src:'images/desk.webp',level:0,colOx:-130,colOy:-60,colW:260,colH:100,itemsOnTop:[{id:'盆栽',src:'images/plant.webp',w:80,h:80,offsetX:-30,offsetY:-50}]},
{id:'方桌',cx:1120,cy:400,w:200,h:120,src:'images/desk.webp',level:0,colOx:-130,colOy:-60,colW:260,colH:100,itemsOnTop:[]},
{id:'盆栽',cx:1300,cy:400,w:80,h:80,src:'images/plant.webp',level:0,colOx:-30,colOy:-35,colW:80,colH:50},
{id:'椅子',cx:1200,cy:520,w:55,h:100,src:'images/chair.webp',level:0,colOx:-40,colOy:-45,colW:95,colH:50,exitDir:'e'},
{id:'椅子',cx:1130,cy:350,w:55,h:100,src:'images/chair.webp',level:0,colOx:-40,colOy:-45,colW:95,colH:50,exitDir:'e'},
{id:'沙发',cx:1000,cy:520,w:300,h:140,src:'images/sofa.webp',level:0,colOx:-180,colOy:-95,colW:360,colH:130,exitDir:'s',seats:[{ox:-90,oy:-95},{ox:-10,oy:-95}]},
{id:'双人床',cx:600,cy:550,w:250,h:280,src:'images/bed.webp',level:0,colOx:-150,colOy:-150,colW:310,colH:250,exitDir:'e',seats:[{ox:-100,oy:-120},{ox:-20,oy:-120}]}
];
function createTip(item){
const tip=document.createElement('div');
tip.textContent=item.id;
tip.style.cssText='position:absolute;color:#fff;font-size:14px;font-weight:bold;text-shadow:1px 1px 2px rgba(0,0,0,.9),-1px -1px 2px rgba(0,0,0,.9),1px -1px 2px rgba(0,0,0,.9),-1px 1px 2px rgba(0,0,0,.9);white-space:nowrap;display:none;z-index:999;pointer-events:none;transform:translate(-50%,-100%)';
tipsContainer.appendChild(tip);
const action=document.createElement('div');
action.textContent='';
action.style.cssText='position:absolute;color:#ffeb3b;font-size:14px;font-weight:bold;text-shadow:1px 1px 2px rgba(0,0,0,.9),-1px -1px 2px rgba(0,0,0,.9),1px -1px 2px rgba(0,0,0,.9),-1px 1px 2px rgba(0,0,0,.9);white-space:nowrap;display:none;z-index:1000;pointer-events:none;transform:translate(-50%,0)';
tipsContainer.appendChild(action);
item.tipElement=tip;
item.actionTipElement=action;
}
carpetData.forEach(i=>{loadImage(i.src);createTip(i)});
furnitureData.forEach(i=>{loadImage(i.src);if(i.itemsOnTop)i.itemsOnTop.forEach(s=>loadImage(s.src));createTip(i)});
function pointInRect(px,py,rx,ry,rw,rh){return px>=rx&&px<rx+rw&&py>=ry&&py<ry+rh}
function getFurnitureRects(){return furnitureData.map(i=>{const w=i.colW??5,h=i.colH??5;if(w<=0||h<=0)return null;return{id:i.id,x:i.cx+(i.colOx??0),y:i.cy+(i.colOy??0),w,h}}).filter(Boolean)}
function isPosFree(x,y){if(x<0||y<0||x>worldWidth-playerSize||y>worldHeight-playerSize)return false;const cx=x+playerSize/2,cy=y+playerSize/2;for(const r of getFurnitureRects())if(pointInRect(cx,cy,r.x,r.y,r.w,r.h))return false;return true}
function resolveOutOfCollision(x,y){if(isPosFree(x,y))return{x,y};let px=x,py=y;const rects=getFurnitureRects();for(let s=0;s<24;s++){let stuck=false;const cx=px+playerSize/2,cy=py+playerSize/2;for(const r of rects){if(pointInRect(cx,cy,r.x,r.y,r.w,r.h)){stuck=true;const dx=cx-(r.x+r.w/2),dy=cy-(r.y+r.h/2);if(Math.abs(dx)>Math.abs(dy)){if(dx>0)px=r.x+r.w-playerSize/2+2;else px=r.x-playerSize/2-2}else{if(dy>0)py=r.y+r.h-playerSize/2+2;else py=r.y-playerSize/2-2}px=Math.max(0,Math.min(worldWidth-playerSize,px));py=Math.max(0,Math.min(worldHeight-playerSize,py))}}if(!stuck)break}if(isPosFree(px,py))return{x:px,y:py};for(let r=12;r<=240;r+=12){for(let a=0;a<16;a++){const ang=a/16*Math.PI*2,nx=Math.round(x+Math.cos(ang)*r),ny=Math.round(y+Math.sin(ang)*r);if(isPosFree(nx,ny))return{x:nx,y:ny}}}return{x:px,y:py}}
function getExitCandidates(target,prevSeat){
const dir=target.exitDir||'s',cx=target.cx,cy=target.cy,hw=target.w/2,hh=target.h/2,ps=playerSize/2;
const map={
s:[{x:cx-ps,y:cy+hh+10},{x:cx-ps-40,y:cy+hh+10},{x:cx-ps+40,y:cy+hh+10},{x:cx-ps,y:cy+hh+40},{x:cx-ps-60,y:cy+hh},{x:cx-ps+60,y:cy+hh}],
n:[{x:cx-ps,y:cy-hh-playerSize-10},{x:cx-ps-40,y:cy-hh-playerSize-10},{x:cx-ps+40,y:cy-hh-playerSize-10},{x:cx-ps,y:cy-hh-playerSize-40}],
e:[{x:cx+hw+10,y:cy-ps},{x:cx+hw+10,y:cy-ps-30},{x:cx+hw+10,y:cy-ps+30},{x:cx+hw+40,y:cy-ps}],
w:[{x:cx-hw-playerSize-10,y:cy-ps},{x:cx-hw-playerSize-10,y:cy-ps-30},{x:cx-hw-playerSize-10,y:cy-ps+30},{x:cx-hw-playerSize-40,y:cy-ps}]
};
let list=map[dir]||map.s;
if(target.id==='双人床'){
const L=prevSeat===0;
if(dir==='s')list=L?[{x:cx-ps-70,y:cy+hh-30},{x:cx-ps-40,y:cy+hh-10},{x:cx-ps,y:cy+hh+10},{x:cx-ps-90,y:cy+hh},{x:cx-ps-50,y:cy+hh+40}]:[{x:cx-ps+50,y:cy+hh-30},{x:cx-ps+20,y:cy+hh-10},{x:cx-ps,y:cy+hh+10},{x:cx-ps+90,y:cy+hh},{x:cx-ps+50,y:cy+hh+40}];
}
return list;
}
function findNearestFreeSpot(ox,oy,extra=[]){
const base=[{x:ox,y:oy},{x:ox-40,y:oy},{x:ox+40,y:oy},{x:ox,y:oy-40},{x:ox,y:oy+40},{x:ox-60,y:oy-20},{x:ox+60,y:oy-20},{x:ox-60,y:oy+20},{x:ox+60,y:oy+20},{x:ox-80,y:oy},{x:ox+80,y:oy},{x:ox,y:oy+60},{x:ox,y:oy-60},{x:ox-50,y:oy+50},{x:ox+50,y:oy+50},{x:ox-50,y:oy-50},{x:ox+50,y:oy-50}];
/* exitDir 候选点必须保持原方向，不能先经过 resolveOutOfCollision，否则东侧候选点被桌子挡住时可能被“推”到北侧。 */
for(const c of extra)if(isPosFree(c.x,c.y))return{x:c.x,y:c.y};
/* 指定方向没有直接可用的位置，再使用普通的最近空位搜索。 */
const all=[...base];
all.sort((a,b)=>((a.x-ox)**2+(a.y-oy)**2)-((b.x-ox)**2+(b.y-oy)**2));
for(const c of all){const p=resolveOutOfCollision(c.x,c.y);if(isPosFree(p.x,p.y))return p}
return resolveOutOfCollision(ox,oy)
}
function placeAt(x,y){const p=resolveOutOfCollision(x,y);posX=p.x;posY=p.y}
function applySpawn(role){placeAt(role==='join'?SPAWN_JOIN.x:SPAWN_HOST.x,role==='join'?SPAWN_JOIN.y:SPAWN_HOST.y)}
function log(msg){const d=document.createElement('div');d.textContent=`[${new Date().toLocaleTimeString()}] ${msg}`;logBody.prepend(d)}
function isMoving(){return keys.has('w')||keys.has('s')||keys.has('a')||keys.has('d')}
function startWalk(){if(isWalking||isSitting)return;isWalking=true;walkIdx=0;walkStartTime=Date.now();currentFrameMs=100;walkTimer=setInterval(()=>walkIdx=1-walkIdx,currentFrameMs);log('开始走路')}
function stopWalk(){if(!isWalking)return;const e=Date.now()-walkStartTime;if(e<300){setTimeout(stopWalk,300-e);return}isWalking=false;clearInterval(walkTimer);walkTimer=null;log('停止走路')}
function getChairs(){return furnitureData.filter(i=>i.id==='椅子')}
function getSofas(){return furnitureData.filter(i=>i.id==='沙发')}
function getBeds(){return furnitureData.filter(i=>i.id==='双人床')}
function getSofa(){return furnitureData.find(i=>i.id==='沙发')}
function getBed(){return furnitureData.find(i=>i.id==='双人床')}
function isItemOccupiedByRemote(item){if(!remote.active||!remote.sitting||!item)return false;if(item.seats){for(const s of item.seats){const dx=(remote.x+playerSize/2)-(item.cx+s.ox+playerSize/2),dy=(remote.y+playerSize/2)-(item.cy+s.oy+playerSize/2);if(Math.hypot(dx,dy)<55)return true}return false}return Math.hypot((remote.x+playerSize/2)-item.cx,(remote.y+playerSize/2)-item.cy)<80}

function initWebRTC(isHost){
pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});
pc.onicecandidate=e=>{if(e.candidate)sendSignal({type:'candidate',candidate:e.candidate,room:currentRoom})};
pc.onconnectionstatechange=()=>{const st=pc.connectionState;log('连接状态: '+st);if(st==='connected'){if(disconnectTimer){clearTimeout(disconnectTimer);disconnectTimer=null}onlineStatus.textContent=(onlineStatus.textContent.replace('等待加入...','已连接'))+' (P2P已连通)';setWaitingInfo('连接成功','P2P已连通，等待状态同步...',currentRoom);tryEnterGame()}else if(st==='disconnected'){if(disconnectTimer)clearTimeout(disconnectTimer);disconnectTimer=setTimeout(()=>{if(pc&&pc.connectionState!=='connected')backToModeSelect('连接超时未恢复')},12000)}else if(st==='failed'||st==='closed')backToModeSelect('P2P连接失败/关闭')};
pc.ondatachannel=e=>{dc=e.channel;setupDC()};
if(isHost){dc=pc.createDataChannel('game',{ordered:true});setupDC();createAndSendOffer()}
}
async function createAndSendOffer(){try{const offer=await pc.createOffer();await pc.setLocalDescription(offer);setTimeout(()=>{if(pc.localDescription)sendSignal({type:'offer',sdp:pc.localDescription,room:currentRoom})},800)}catch(e){log('创建 Offer 失败: '+e.message)}}
async function handleRemoteOffer(sdp){try{await pc.setRemoteDescription(new RTCSessionDescription(sdp));await flushPendingCandidates();const answer=await pc.createAnswer();await pc.setLocalDescription(answer);setTimeout(()=>{if(pc.localDescription)sendSignal({type:'answer',sdp:pc.localDescription,room:currentRoom})},800)}catch(e){log('处理 Offer 失败: '+e.message)}}
function setupDC(){
dc.onopen=()=>{log('数据通道已打开');if(signalPosTimer){clearInterval(signalPosTimer);signalPosTimer=null}sendStateNow();sendStateBurst();setWaitingInfo('连接成功','数据通道已打开，等待状态同步...',currentRoom);tryEnterGame()};
dc.onclose=()=>{if(disconnectTimer)clearTimeout(disconnectTimer);disconnectTimer=setTimeout(()=>{if(!dc||dc.readyState!=='open')backToModeSelect('数据通道长时间未恢复')},12000)};
dc.onmessage=e=>{try{const data=JSON.parse(e.data);remote.x=data.x;remote.y=data.y;remote.sitting=!!data.sitting;remote.walking=!!data.walking;remote.idx=data.idx||0;remote.active=true;peerSynced=true;tryEnterGame();const now=Date.now();if(now-lastRemoteLog>500){lastRemoteLog=now;log(`对方 → X:${Math.round(remote.x)} Y:${Math.round(remote.y)}`)}}catch{}};
setInterval(()=>{if(dc&&dc.readyState==='open')try{dc.send(JSON.stringify({x:posX,y:posY,sitting:isSitting,walking:isWalking,idx:walkIdx}))}catch{}},40);
}
preloadAllImages().then(()=>{[playerIdle,playerSit,playerSleep,...walkFrames,remoteIdle,remoteSit,remoteSleep,...remoteWalk].forEach(loadImage);log('系统初始化完成');update()});
</script>
