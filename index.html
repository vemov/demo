<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none}
html,body{width:100vw;height:100vh;overflow:hidden;font-family:sans-serif}
#viewport{width:100vw;height:100vh;overflow:hidden;position:relative}
#game-area{width:2000px;height:1000px;position:relative;background-color:#f3e5f5}
#game-canvas{display:block;background-color:#f3e5f5;background-image:url('./images/background.webp'),linear-gradient(#e1bee7 1px,transparent 1px),linear-gradient(90deg,#e1bee7 1px,transparent 1px);background-repeat:repeat,repeat,repeat;background-size:64px 64px,40px 40px,40px 40px;background-position:center;image-rendering:pixelated}
#terminal-container{position:fixed;bottom:0;left:0;width:100%;height:30px;background:rgba(34,34,34,0.9);color:#fff;font-family:monospace;z-index:9999;display:flex;flex-direction:column;transition:height 0.3s ease}
#terminal-container.expanded{height:180px}
#terminal-header{padding:5px 10px;background:#333;cursor:pointer;display:flex;justify-content:space-between;flex-shrink:0}
#terminal-body{flex:1;overflow-y:auto;padding:10px}
#terminal-body::-webkit-scrollbar{width:8px}
#terminal-body::-webkit-scrollbar-track{background:#111}
#terminal-body::-webkit-scrollbar-thumb{background:#555;border-radius:4px}
#terminal-body::-webkit-scrollbar-thumb:hover{background:#777}
</style>
</head>
<body>
<div id="viewport">
<div id="game-area">
<canvas id="game-canvas" width="2000" height="1000"></canvas>
<div id="tips-container"></div>
</div>
</div>
<div id="terminal-container">
<div id="terminal-header" onclick="document.getElementById('terminal-container').classList.toggle('expanded')">
<span>日志终端 | 坐标: <span id="coords-val">X: 0, Y: 0</span></span>
<span>[展开/收起]</span>
</div>
<div id="terminal-body"></div>
</div>
<script src="./virtual-controls.js" defer></script>
<script>
const viewport=document.getElementById('viewport'),gameArea=document.getElementById('game-area'),canvas=document.getElementById('game-canvas'),ctx=canvas.getContext('2d'),coordsVal=document.getElementById('coords-val'),logBody=document.getElementById('terminal-body'),tipsContainer=document.getElementById('tips-container');
ctx.imageSmoothingEnabled = false;
const worldWidth=2000, worldHeight=1000, playerSize=120;
let posX=worldWidth/2-playerSize/2,posY=worldHeight/2-playerSize/2,speed=5,keys=new Set(),isWalking=false,walkIdx=0,walkTimer=null;
const moveKeys=new Set(['w','a','s','d']),walkFrames=['./images/walk/walk_0001.webp','./images/walk/walk_0002.webp'];
let currentFrameMs=100,walkStartTime=0;
const images = {};
function loadImage(src) {
    if(images[src]) return images[src];
    const img = new Image();
    img.src = src;
    images[src] = img;
    return img;
}
loadImage('./images/player.webp');
walkFrames.forEach(s=>loadImage(s));
const carpetData=[
    {id:'地毯', cx:1000, cy:450, w:450, h:250, src:'images/carpet.webp', level:-1}
];
const furnitureData=[
    {
        id:'方桌', cx:900, cy:400, w:200, h:120, src:'images/desk.webp', level:0,
        colOffsetX1:-75, colOffsetX2:75, colOffsetY1:-25, colOffsetY2:-25,
        itemsOnTop: [
            { id: '盆栽', src: 'images/plant.webp', w: 80, h: 80, offsetX: -30, offsetY: -50 }
        ]
    },
    {
        id:'方桌', cx:1120, cy:400, w:200, h:120, src:'images/desk.webp', level:0,
        colOffsetX1:-75, colOffsetX2:75, colOffsetY1:-25, colOffsetY2:-25,
        itemsOnTop: []
    },
    {id:'盆栽', cx:1300, cy:400, w:80, h:80, src:'images/plant.webp', level:0, colOffsetX1:15, colOffsetX2:-5, colOffsetY1:-15, colOffsetY2:-25}
];
carpetData.forEach(item => {
    loadImage(item.src);
    const tip = document.createElement('div');
    tip.textContent = item.id;
    tip.style.cssText = `position:absolute;color:#fff;font-size:14px;font-weight:bold;text-shadow:1px 1px 2px rgba(0,0,0,.9),-1px -1px 2px rgba(0,0,0,.9),1px -1px 2px rgba(0,0,0,.9),-1px 1px 2px rgba(0,0,0,.9);white-space:nowrap;display:none;z-index:999;pointer-events:none;transform:translate(-50%,0)`;
    tipsContainer.appendChild(tip);
    item.tipElement = tip;
});
furnitureData.forEach(item => {
    loadImage(item.src);
    if(item.itemsOnTop && Array.isArray(item.itemsOnTop)){
        item.itemsOnTop.forEach(sub => loadImage(sub.src));
    }
    const tip = document.createElement('div');
    tip.textContent = item.id;
    tip.style.cssText = `position:absolute;color:#fff;font-size:14px;font-weight:bold;text-shadow:1px 1px 2px rgba(0,0,0,.9),-1px -1px 2px rgba(0,0,0,.9),1px -1px 2px rgba(0,0,0,.9),-1px 1px 2px rgba(0,0,0,.9);white-space:nowrap;display:none;z-index:999;pointer-events:none;transform:translate(-50%,0)`;
    tipsContainer.appendChild(tip);
    item.tipElement = tip;
});
function getFurnitureRects(){
    return furnitureData.map(i=>{
        const x1 = i.colOffsetX1 !== undefined ? i.colOffsetX1 : -i.w / 2;
        const x2 = i.colOffsetX2 !== undefined ? i.colOffsetX2 : i.w / 2;
        const y1 = i.colOffsetY1 !== undefined ? i.colOffsetY1 : -i.h / 2;
        const y2 = i.colOffsetY2 !== undefined ? i.colOffsetY2 : i.h / 2;
        return {
            x: i.cx + x1,
            y: i.cy + y1,
            w: (i.cx + x2) - (i.cx + x1),
            h: (i.cy + y2) - (i.cy + y1)
        };
    });
}
function log(msg){const d=document.createElement('div');d.textContent=`[${new Date().toLocaleTimeString()}] ${msg}`;logBody.prepend(d)}
function isMoving(){return keys.has('w')||keys.has('s')||keys.has('a')||keys.has('d')}
function startWalk(){
    if(isWalking) return;
    isWalking = true;
    walkIdx = 0;
    walkStartTime = Date.now();
    currentFrameMs = 100;
    walkTimer = setInterval(nextFrame, currentFrameMs);
    log('开始走路');
}
function nextFrame(){walkIdx=1-walkIdx;}
function stopWalk(){
    if(!isWalking)return;
    const elapsed=Date.now()-walkStartTime;
    if(elapsed<300){
        setTimeout(stopWalk,300-elapsed);
        return;
    }
    isWalking=false;clearInterval(walkTimer);walkTimer=null;log('停止走路')
}
window.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(!keys.has(k)){
        keys.add(k);
        log(`按下按键: ${e.key}`);
        if(moveKeys.has(k)) startWalk();
    }
});
window.addEventListener('keyup',e=>{
    const k=e.key.toLowerCase();
    keys.delete(k);
    if(moveKeys.has(k) && !isMoving()){
        stopWalk();
    }
});
window.addEventListener('blur',()=>{keys.clear();stopWalk();log('窗口失去焦点，已重置按键')});
document.addEventListener('visibilitychange',()=>{if(document.hidden){keys.clear();stopWalk()}});
function checkCollision(x,y,w,h,rx,ry,rw,rh){return x<rx+rw&&x+w>rx&&y<ry+rh&&y+h>ry}
function update(){
    if(isWalking){const targetMs=100;if(targetMs!==currentFrameMs){currentFrameMs=targetMs;clearInterval(walkTimer);walkTimer=setInterval(nextFrame,currentFrameMs)}}
    let nextX=posX,nextY=posY;
    if(keys.has('w'))nextY-=speed;if(keys.has('s'))nextY+=speed;if(keys.has('a'))nextX-=speed;if(keys.has('d'))nextX+=speed;
    const maxX=worldWidth-playerSize,maxY=worldHeight-playerSize;
    nextX=Math.max(0,Math.min(maxX,nextX));nextY=Math.max(0,Math.min(maxY,nextY));
    const leftX=0,rightX=0,upY=0,downY=0,pBoxW=playerSize-leftX-rightX,pBoxH=playerSize-upY-downY,rects=getFurnitureRects();
    let canMoveX=true,canMoveY=true;
    for(const r of rects){if(checkCollision(nextX+leftX,posY+upY,pBoxW,pBoxH,r.x,r.y,r.w,r.h)){canMoveX=false;break}}
    if(canMoveX)posX=nextX;
    for(const r of rects){if(checkCollision(posX+leftX,nextY+upY,pBoxW,pBoxH,r.x,r.y,r.w,r.h)){canMoveY=false;break}}
    if(canMoveY)posY=nextY;
    let stuck=true,safety=0;
    while(stuck&&safety<10){
        stuck=false;
        safety++;
        for(const r of rects){
            const pBox={x:posX+leftX,y:posY+upY,w:pBoxW,h:pBoxH};
            if(checkCollision(pBox.x,pBox.y,pBox.w,pBox.h,r.x,r.y,r.w,r.h)){
                stuck=true;
                const overlapX=Math.min(pBox.x+pBox.w-r.x, r.x+r.w-pBox.x);
                const overlapY=Math.min(pBox.y+pBox.h-r.y, r.y+r.h-pBox.y);
                if(overlapX<overlapY){
                    if(pBox.x+pBox.w/2 < r.x+r.w/2) posX-=overlapX;
                    else posX+=overlapX;
                }else{
                    if(pBox.y+pBox.h/2 < r.y+r.h/2) posY-=overlapY;
                    else posY+=overlapY;
                }
                posX=Math.max(0,Math.min(maxX,posX));
                posY=Math.max(0,Math.min(maxY,posY));
            }
        }
    }
    const currentPBox={x:posX+leftX,y:posY+upY,w:pBoxW,h:pBoxH},threshold=30;
    carpetData.forEach(item=>{
        item.tipElement.style.display='none';
        item.tipElement.textContent=item.id;
    });
    furnitureData.forEach(item=>{
        item.tipElement.style.display='none';
        let displayName = item.id;
        if(item.itemsOnTop && item.itemsOnTop.length > 0){
            const topNames = item.itemsOnTop.map(sub => sub.id).filter(Boolean);
            if(topNames.length > 0){
                displayName += ' ' + topNames.join(' ');
            }
        }
        item.tipElement.textContent = displayName;
    });
    const allInteractives = [...carpetData, ...furnitureData];
    const activeItems = allInteractives.filter(item=>{
        const rect={x:item.cx-item.w/2,y:item.cy-item.h/2,w:item.w,h:item.h},pRect={x:rect.x-threshold,y:rect.y-threshold,w:rect.w+2*threshold,h:rect.h+2*threshold};
        return checkCollision(currentPBox.x,currentPBox.y,currentPBox.w,currentPBox.h,pRect.x,pRect.y,pRect.w,pRect.h);
    });
    const clusters = [];
    activeItems.forEach(item=>{
        let added = false;
        for(const cluster of clusters){
            const isClose = cluster.some(ci=>{
                const dx = ci.cx - item.cx;
                const dy = ci.cy - item.cy;
                return Math.sqrt(dx*dx + dy*dy) < 180;
            });
            if(isClose){
                cluster.push(item);
                added = true;
                break;
            }
        }
        if(!added){
            clusters.push([item]);
        }
    });
    clusters.forEach(cluster=>{
        if(cluster.length === 1){
            cluster[0].tipElement.style.left = cluster[0].cx + 'px';
            cluster[0].tipElement.style.top = (cluster[0].cy - cluster[0].h/2 - 25) + 'px';
            cluster[0].tipElement.style.display = 'block';
        }else{
            const maxLevel = Math.max(...cluster.map(i => i.level));
            const topItems = cluster.filter(i => i.level === maxLevel);
            const combinedName = Array.from(new Set(topItems.flatMap(i => {
                let names = [i.id];
                if(i.itemsOnTop) {
                    i.itemsOnTop.forEach(sub => { if(sub.id) names.push(sub.id); });
                }
                return names;
            }))).join(' ');
            const primary = topItems[0];
            const avgCx = topItems.reduce((sum, i) => sum + i.cx, 0) / topItems.length;
            const minTopY = Math.min(...topItems.map(i => i.cy - i.h/2));
            primary.tipElement.textContent = combinedName;
            primary.tipElement.style.left = avgCx + 'px';
            primary.tipElement.style.top = (minTopY - 25) + 'px';
            primary.tipElement.style.display = 'block';
        }
    });
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const renderList = [];
    carpetData.forEach((item, index) => {
        renderList.push({
            type: 'carpet',
            data: item,
            y: item.cy + item.h / 2,
            level: item.level,
            originalIndex: index
        });
    });
    furnitureData.forEach((item, index) => {
        renderList.push({
            type: 'furniture',
            data: item,
            y: item.cy + item.h / 2,
            level: item.level,
            originalIndex: index
        });
    });
    const pBottom = currentPBox.y + currentPBox.h;
    renderList.push({
        type: 'player',
        y: pBottom,
        level: 0,
        originalIndex: 9999
    });
    renderList.sort((a, b) => {
        if (a.level !== b.level) {
            return a.level - b.level;
        }
        if (a.y !== b.y) {
            return a.y - b.y;
        }
        if (a.type === 'player' && b.type !== 'player') {
            return 1;
        }
        if (a.type !== 'player' && b.type === 'player') {
            return -1;
        }
        return a.originalIndex - b.originalIndex;
    });
    renderList.forEach(item => {
        if (item.type === 'carpet') {
            const c = item.data;
            const img = images[c.src];
            if (img && img.complete && img.naturalWidth !== 0) {
                ctx.drawImage(img, Math.round(c.cx - c.w/2), Math.round(c.cy - c.h/2), c.w, c.h);
            } else {
                ctx.fillStyle = '#d7ccc8';
                ctx.fillRect(Math.round(c.cx - c.w/2), Math.round(c.cy - c.h/2), c.w, c.h);
            }
        } else if (item.type === 'furniture') {
            const f = item.data;
            const img = images[f.src];
            if (img && img.complete && img.naturalWidth !== 0) {
                ctx.drawImage(img, Math.round(f.cx - f.w/2), Math.round(f.cy - f.h/2), f.w, f.h);
            } else {
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(Math.round(f.cx - f.w/2), Math.round(f.cy - f.h/2), f.w, f.h);
            }
            if (f.itemsOnTop && Array.isArray(f.itemsOnTop)) {
                f.itemsOnTop.forEach(sub => {
                    const subImg = images[sub.src];
                    const subX = f.cx + (sub.offsetX || 0) - (sub.w / 2);
                    const subY = f.cy + (sub.offsetY || 0) - (sub.h / 2);
                    if (subImg && subImg.complete && subImg.naturalWidth !== 0) {
                        ctx.drawImage(subImg, Math.round(subX), Math.round(subY), sub.w, sub.h);
                    } else {
                        ctx.fillStyle = '#555';
                        ctx.fillRect(Math.round(subX), Math.round(subY), sub.w, sub.h);
                    }
                });
            }
        } else if (item.type === 'player') {
            const playerImgSrc = isWalking ? walkFrames[walkIdx] : './images/player.webp';
            const img = images[playerImgSrc];
            if (img && img.complete && img.naturalWidth !== 0) {
                ctx.drawImage(img, Math.round(posX), Math.round(posY), playerSize, playerSize);
            } else {
                ctx.fillStyle = '#8A2BE2';
                ctx.fillRect(Math.round(posX), Math.round(posY), playerSize, playerSize);
            }
        }
    });
    if(isMoving()){
        if(!isWalking) startWalk();
    }else{
        if(isWalking) stopWalk();
    }
    coordsVal.textContent=`X: ${Math.round(posX)}, Y: ${Math.round(posY)}`;
    viewport.scrollTo({
        left: posX + playerSize/2 - window.innerWidth/2,
        top: posY + playerSize/2 - window.innerHeight/2,
        behavior: 'auto'
    });
    requestAnimationFrame(update);
}
update(); log('系统初始化完成');
</script>
</body>
</html>
